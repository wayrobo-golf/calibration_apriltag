[metadata]
name = dynamic-rosbag-calibration
version = 0.1.0
description = Standalone multi-rosbag dynamic calibration library
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.10
install_requires =
    numpy>=1.23
    opencv-python-headless>=4.5
    pyapriltags>=3.3
    PyYAML>=5.4
    rosbags>=0.9
    scipy>=1.9

[options.packages.find]
where = src

[options.extras_require]
analysis =
    plotly>=5.0
test =
    pytest>=6.2

[options.entry_points]
console_scripts =
    dynamic-rosbag-calibration = dynamic_rosbag_calibration.pipeline:main
